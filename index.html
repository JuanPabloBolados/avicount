<style>
  :root {
    color-scheme: light;
    --surface-1: #fcfcfb; --page: #f9f9f7; --ink-1: #0b0b0b; --ink-2: #52514e;
    --muted: #898781; --grid: #e1e0d9; --baseline: #c3c2b7; --border: rgba(11,11,11,0.10);
    --accent: #2a78d6; --accent-ink: #ffffff;
    --good: #0ca30c; --good-text: #006300; --warning: #fab219; --critical: #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --surface-1: #1a1a19; --page: #0d0d0d; --ink-1: #ffffff; --ink-2: #c3c2b7;
      --grid: #2c2c2a; --baseline: #383835; --border: rgba(255,255,255,0.10);
      --accent: #3987e5; --good-text: #0ca30c;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page); color: var(--ink-1);
    max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; min-height: 100dvh;
  }
  header { padding: 14px 16px 10px; display: flex; align-items: center; justify-content: space-between; }
  header h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.2px; }
  header h1 span { color: var(--accent); }
  .badge {
    font-size: 11px; font-weight: 600; color: var(--ink-2);
    border: 1px solid var(--border); border-radius: 99px; padding: 3px 9px; background: var(--surface-1);
  }
  main { flex: 1; overflow-y: auto; padding: 0 16px 84px; }
  nav {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 480px; display: flex; background: var(--surface-1);
    border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom);
  }
  nav button {
    flex: 1; background: none; border: none; padding: 10px 0 12px; font-size: 11px;
    color: var(--muted); cursor: pointer; display: flex; flex-direction: column;
    align-items: center; gap: 3px; font-family: inherit;
  }
  nav[hidden] { display: none; }   /* si no, display:flex gana sobre el atributo */
  nav button.active { color: var(--accent); font-weight: 600; }
  nav button svg { width: 22px; height: 22px; }
  .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; }
  .card h3 { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
  .sub { font-size: 12.5px; color: var(--ink-2); }
  .mut { font-size: 12px; color: var(--muted); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0 14px; }
  .tile { background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; }
  .tile .v { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; margin: 2px 0; }
  .tile .l { font-size: 11.5px; color: var(--ink-2); }
  .status { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; border-radius: 99px; padding: 3px 10px 3px 8px; }
  .status.ok { color: var(--good-text); background: color-mix(in srgb, var(--good) 12%, transparent); }
  .status.warn { color: var(--ink-1); background: color-mix(in srgb, var(--warning) 20%, transparent); }
  .status.crit { color: var(--critical); background: color-mix(in srgb, var(--critical) 12%, transparent); }
  .status.pending { color: var(--ink-2); background: color-mix(in srgb, var(--muted) 14%, transparent); }
  .btn {
    display: block; width: 100%; text-align: center; background: var(--accent); color: var(--accent-ink);
    border: none; border-radius: 12px; padding: 14px; font-size: 15px; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  .btn.secondary { background: var(--surface-1); color: var(--ink-1); border: 1px solid var(--border); }
  .btn.small { padding: 10px; font-size: 13.5px; border-radius: 10px; }
  .btn:disabled { opacity: .45; cursor: default; }
  .zone-dots { display: flex; gap: 6px; margin: 10px 0 14px; }
  .zone-dots i { flex: 1; height: 5px; border-radius: 3px; background: var(--grid); }
  .zone-dots i.done { background: var(--good); }
  .zone-dots i.now { background: var(--accent); }
  .capture-box {
    border: 1.5px dashed var(--baseline); border-radius: 14px; aspect-ratio: 4/3;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    color: var(--muted); background: var(--surface-1); position: relative; overflow: hidden;
    margin-bottom: 12px; cursor: pointer;
  }
  .capture-box canvas, .capture-box img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .count-big { font-size: 44px; font-weight: 700; letter-spacing: -1px; text-align: center; }
  .count-lbl { text-align: center; font-size: 13px; color: var(--ink-2); margin-bottom: 12px; }
  input, select { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-1); color: var(--ink-1); font-size: 15px; font-family: inherit; margin-top: 4px; }
  label { font-size: 13px; font-weight: 600; color: var(--ink-2); display: block; margin-top: 12px; }
  .stepper { display: flex; align-items: center; gap: 10px; justify-content: center; margin: 8px 0 4px; }
  .stepper button { width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface-1); color: var(--ink-1); font-size: 22px; cursor: pointer; }
  .stepper input { width: 110px; text-align: center; font-size: 24px; font-weight: 700; }
  .list-item { padding: 13px 0; border-bottom: 1px solid var(--grid); }
  .list-item:last-child { border-bottom: none; }
  .spin { width: 26px; height: 26px; border: 3px solid var(--grid); border-top-color: var(--accent); border-radius: 50%; animation: sp .8s linear infinite; margin: 0 auto; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .hint { font-size: 12.5px; color: var(--ink-2); background: color-mix(in srgb, var(--accent) 8%, transparent); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; }
  .bar-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .bar-track { flex: 1; height: 14px; position: relative; }
  .bar-track .zero { position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--baseline); }
  .bar-track .bar { position: absolute; top: 2px; height: 10px; border-radius: 0 4px 4px 0; }
  .bar-lbl { font-size: 12px; width: 76px; color: var(--ink-2); flex-shrink: 0; }
  .bar-val { font-size: 12px; font-weight: 600; width: 48px; text-align: right; font-variant-numeric: tabular-nums; }
  h2.sec { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 0 8px; }
  .back { background: none; border: none; color: var(--accent); font-size: 14px; font-weight: 600; cursor: pointer; padding: 0; font-family: inherit; margin-bottom: 10px; }
  .toast {
    position: fixed; bottom: 76px; left: 50%; transform: translateX(-50%);
    background: var(--ink-1); color: var(--page); font-size: 13.5px; font-weight: 500;
    padding: 10px 18px; border-radius: 99px; opacity: 0; transition: opacity .25s; pointer-events: none;
    max-width: 90%; text-align: center; z-index: 50;
  }
  .toast.show { opacity: .95; }
  .login-wrap { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 24px 80px; }
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const APP_VERSION = 'v1.6.3 · 31-ago-2026';

// Proyecto propio (la clave publishable es pública por diseño; los datos
// están protegidos por RLS y solo se accede vía la API con credenciales).
const SUPA_URL = 'https://mgabiviiocowkeohuerc.supabase.co';
const SUPA_KEY = 'sb_publishable_HfCJZBPazo2s7Acgx_IPbA_sHLKP8AS';
// Google necesita una página https para volver tras el login; abierto como
// archivo (file://) se usa el código del equipo.
const sb = (window.supabase && location.protocol.startsWith('http'))
  ? window.supabase.createClient(SUPA_URL, SUPA_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
    })
  : null;

async function tokenGoogle() {
  if (!sb) return null;
  try { return (await sb.auth.getSession()).data.session?.access_token || null; }
  catch { return null; }
}
/* ============ AviCount — PRODUCCIÓN ============
   Servida por la Edge Function de Supabase que también expone la API.
   Cada foto guardada construye el dataset de entrenamiento del modelo
   (aprendizaje continuo): foto + conteo del modelo + corrección humana.
================================================= */

// La app se sirve como archivo estático (Storage) y habla siempre con
// la Edge Function, sin importar desde dónde se abra: la URL publicada,
// el ícono instalado en el celular, o el archivo descargado.
const API = 'https://mgabiviiocowkeohuerc.supabase.co/functions/v1/avicount';
const LS = {
  get: (k, d) => { try { const v = localStorage.getItem('avicount_' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  // Devuelve si de verdad se guardó: si el teléfono se queda sin espacio
  // no podemos decirle al operario que quedó guardado.
  set: (k, v) => { try { localStorage.setItem('avicount_' + k, JSON.stringify(v)); return true; } catch { return false; } },
};

// Escapa texto antes de meterlo en el HTML (nombres de galpón, operario…)
const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const idUnico = () => (crypto.randomUUID ? crypto.randomUUID()
  : 'c' + Date.now() + '-' + Math.random().toString(36).slice(2));

const state = {
  view: 'galpones',
  codigo: LS.get('codigo', ''),
  googleListo: LS.get('googleListo', false),
  googleEmail: LS.get('googleEmail', ''),
  operario: LS.get('operario', ''),
  modeloUrl: LS.get('modeloUrl', ''),
  modeloToken: LS.get('modeloToken', ''),
  galpones: [],
  sesiones: [],
  movimientos: [],
  mortalidad14: [],
  cargando: false,
  conteo: null,
  puerta: null,
  editGalpon: null,
};

const TIPOS_MOV = {
  poblamiento: 'Poblamiento', traslado_entrada: 'Traslado (entrada)',
  traslado_salida: 'Traslado (salida)', carga_venta: 'Carga / venta',
  mortalidad: 'Mortalidad', ajuste_manual: 'Ajuste manual',
};

const $ = s => document.querySelector(s);
const fmt = n => (n == null || Number.isNaN(n)) ? '—' : Number(n).toLocaleString('es-CL');
const desv = (est, teo) => (est != null && teo) ? (est - teo) / teo * 100 : null;
const fecha = ts => ts ? new Date(ts).toLocaleString('es-CL', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '—';

function toast(msg, ms = 2600) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), ms);
}

function statusChip(pct) {
  if (pct == null) return `<span class="status pending">Sin conteo</span>`;
  const a = Math.abs(pct), txt = (pct > 0 ? '+' : '') + pct.toFixed(1) + '%';
  if (a <= 2) return `<span class="status ok">✓ ${txt}</span>`;
  if (a <= 5) return `<span class="status warn">⚠ ${txt}</span>`;
  return `<span class="status crit">✕ ${txt}</span>`;
}

/* ---------- API ---------- */
async function api(ruta, body, metodo) {
  const headers = { 'Content-Type': 'application/json' };
  if (state.codigo) headers['x-codigo'] = state.codigo;
  const jwt = await tokenGoogle();
  if (jwt) headers['Authorization'] = 'Bearer ' + jwt;
  const r = await fetch(API + ruta, {
    method: metodo || (body ? 'POST' : 'GET'),
    headers,
    body: body ? JSON.stringify(body) : undefined,
  });
  if (r.status === 401) {
    let cuerpo = null;
    try { cuerpo = await r.json(); } catch { /* sin cuerpo */ }
    if (cuerpo && cuerpo.sin_activar) {
      // Cuenta de Google válida pero sin activar: pedir el código UNA vez.
      state.view = 'activarGoogle'; render();
      const e = new Error('Tu cuenta necesita activarse con el código del equipo');
      e.status = 401; throw e;
    }
    state.codigo = ''; LS.set('codigo', '');
    if (!jwt) render();
    const e = new Error('Código incorrecto'); e.status = 401; throw e;
  }
  if (!r.ok) { const e = new Error('Error del servidor (' + r.status + ')'); e.status = r.status; throw e; }
  return r.json();
}

// Con sesión de Google activada (o código guardado) la app entra directo.
function tieneCredencial() { return !!state.codigo || state.googleListo; }

/* ---------- Cola offline ----------
   Guarda lo que no se pudo subir y lo reintenta al volver la señal.
   Nunca decimos "guardado" si el guardado falló de verdad. */
function encolar(ruta, body) {
  const q = LS.get('cola', []);
  if (q.length >= 40) { toast('Cola llena: conéctate a internet para vaciarla', 4000); return false; }
  q.push({ qid: idUnico(), ruta, body, ts: Date.now() });
  if (LS.set('cola', q)) return true;
  // Sin espacio en el teléfono: el conteo vale más que la foto,
  // así que soltamos la foto y guardamos el número.
  if (body && body.foto_b64) {
    delete body.foto_b64;
    body.foto_perdida = true;
    if (LS.set('cola', q)) { toast('Sin espacio: se guardó el conteo, no la foto', 4000); return true; }
  }
  q.pop();
  return false;
}

// Lo que el servidor rechaza no se borra en silencio: queda registrado
// para poder reclamarlo (sin la foto, que ocuparía demasiado espacio).
function guardarDescartado(item) {
  const d = LS.get('descartados', []);
  const b = item.body || {};
  d.unshift({ ruta: item.ruta, zona: b.zona ?? null, galpon_id: b.galpon_id ?? null,
              conteo: b.conteo_manual ?? b.cantidad ?? null, ts: Date.now() });
  LS.set('descartados', d.slice(0, 30));
}

let drenando = false;
async function drenarCola(silencioso) {
  if (drenando) return;              // evita subir dos veces lo mismo
  const q = LS.get('cola', []);
  if (!q.length) { if (!silencioso) toast('No hay pendientes'); return; }
  // Los pendientes de una versión anterior no traen identificador. Hay que
  // asignarlo Y GUARDARLO antes de subir nada: si no, al terminar no se
  // reconocen como procesados y se vuelven a subir para siempre.
  let faltaban = false;
  q.forEach(i => { if (!i.qid) { i.qid = idUnico(); faltaban = true; } });
  if (faltaban && !LS.set('cola', q)) { toast('Sin espacio para preparar los pendientes', 4000); return; }
  drenando = true;
  let ok = 0, descartados = 0;
  const resto = [];
  try {
    // Orden estricto: un cierre no puede subir antes que sus capturas.
    for (let i = 0; i < q.length; i++) {
      const item = q[i];
      try { await api(item.ruta, item.body); ok++; }
      catch (e) {
        // Un 4xx no se arregla reintentando: quedaría atascado para siempre.
        // Pero la falta de señal NO gasta intentos: un fin de semana sin
        // cobertura no puede borrar el conteo de un galpón.
        const respondio = typeof e.status === 'number';
        const irreparable = respondio && e.status >= 400 && e.status < 500 && e.status !== 401 && e.status !== 429;
        if (respondio) item.intentos = (item.intentos || 0) + 1;
        if (irreparable || item.intentos > 40) { descartados++; guardarDescartado(item); continue; }
        resto.push(...q.slice(i));   // se corta y se reintenta el resto entero
        break;
      }
    }
  } finally {
    // La cola pudo crecer mientras subíamos: conservamos lo nuevo.
    const procesados = new Set(q.map(i => i.qid));
    const nuevos = LS.get('cola', []).filter(i => !procesados.has(i.qid));
    LS.set('cola', resto.concat(nuevos));
    drenando = false;
  }
  if (ok) toast(`${ok} pendiente(s) subido(s)`);
  if (descartados) toast(`${descartados} registro(s) no se pudieron subir y se descartaron`, 4500);
  if (!ok && !descartados && !silencioso) toast(`Sigue sin señal: ${resto.length} pendiente(s)`);
  if (state.view === 'ajustes' || state.view === 'galpones') { render(); if (ok) cargarEstado(); }
}
window.addEventListener('online', () => drenarCola(true));

async function cargarEstado() {
  state.cargando = true; render();
  try {
    const d = await api('/estado');
    state.galpones = d.galpones || [];
    state.sesiones = d.sesiones || [];
    state.movimientos = d.movimientos || [];
    state.mortalidad14 = d.mortalidad_14d || [];
    // El modelo se publica una vez en el servidor y llega a toda la flota.
    // Se guarda para que siga disponible aunque la app arranque sin señal.
    if (d.modelo) LS.set('modeloUrlServidor', d.modelo.url || '');
    state.modeloUrl = LS.get('modeloUrlManual', '') || LS.get('modeloUrlServidor', '') || '';
    state.modeloVersion = (d.modelo && d.modelo.version) || '';
  } catch (e) {
    if (state.codigo) toast('Sin conexión con el servidor: ' + e.message, 3500);
  }
  state.cargando = false; render();
}

/* ---------- Navegación ---------- */
const tabs = [
  { id: 'galpones', label: 'Galpones', icon: 'M3 21V8l9-5 9 5v13h-6v-7H9v7H3z' },
  { id: 'conteo',   label: 'Conteo',   icon: 'M12 8a4 4 0 1 1 0 8 4 4 0 0 1 0-8zm-8 4h2m12 0h2M12 4v2m0 12v2' },
  { id: 'historial',label: 'Historial',icon: 'M12 8v5l3 2M12 3a9 9 0 1 0 9 9' },
  { id: 'ajustes',  label: 'Ajustes',  icon: 'M12 9a3 3 0 1 1 0 6 3 3 0 0 1 0-6zm7.4 3a7.4 7.4 0 0 0-.1-1.2l2-1.5-2-3.4-2.3 1a7.5 7.5 0 0 0-2-1.2L14.6 2h-4L10 4.7a7.5 7.5 0 0 0-2 1.2l-2.3-1-2 3.4 2 1.5a7.4 7.4 0 0 0 0 2.4l-2 1.5 2 3.4 2.3-1c.6.5 1.3.9 2 1.2l.4 2.7h4l.4-2.7c.7-.3 1.4-.7 2-1.2l2.3 1 2-3.4-2-1.5c.1-.4.1-.8.1-1.2z' },
];

function renderNav() {
  $('#nav').hidden = !tieneCredencial() || state.view === 'activarGoogle';
  $('#nav').innerHTML = tabs.map(t => `
    <button class="${state.view === t.id || (t.id === 'conteo' && state.view.startsWith('conteo')) || (t.id === 'conteo' && state.view.startsWith('video')) ? 'active' : ''}" onclick="go('${t.id}')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${t.icon}"/></svg>
      ${t.label}
    </button>`).join('');
}

function go(v) { state.view = v; render(); }

function render() {
  renderNav();
  $('#modeBadge').textContent = state.modeloUrl ? 'MODELO ACTIVO' : 'SIN MODELO (manual)';
  if (state.view === 'activarGoogle') return viewActivarGoogle();
  if (!tieneCredencial()) return viewLogin();
  const v = state.view;
  if (v === 'galpones') return viewGalpones();
  if (v === 'conteo') return viewMetodo();
  if (v === 'conteoFotos') return viewSeleccionGalpon();
  if (v === 'conteoZona') return viewZona();
  if (v === 'conteoResumen') return viewResumen();
  if (v === 'videoSetup') return viewVideoSetup();
  if (v === 'videoResultado') return viewVideoResultado();
  if (v === 'historial') return viewHistorial();
  if (v === 'ajustes') return viewAjustes();
  if (v === 'galponForm') return viewGalponForm();
  if (v === 'guia') return viewGuia();
}

/* ---------- Login ---------- */
function viewLogin() {
  $('#main').innerHTML = `
    <div class="login-wrap">
      <h2 style="font-size:22px;margin-bottom:6px">Bienvenido a AviCount</h2>
      <div class="sub" style="margin-bottom:18px">Conteo de aves por visión.</div>
      ${sb ? `

async function activarGoogle() {
  const cod = $('#actCodigo').value.trim();
  if (!cod) return toast('Ingresa el código');
  try {
    const jwt = await tokenGoogle();
    const r = await fetch(API + '/auth/activar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-codigo': cod, 'Authorization': 'Bearer ' + jwt },
      body: '{}',
    });

    if (!r.ok) return toast(d.error || 'No se pudo activar', 4000);
    state.googleListo = true; LS.set('googleListo', true);
    state.operario = d.nombre || state.googleEmail; LS.set('operario', state.operario);
    toast('Cuenta activada: no se te volverá a pedir nada');
    go('galpones'); cargarEstado();
  } catch (e) { toast('Sin conexión: reintenta', 3500); }
}

// Al volver del login de Google (o al abrir con sesión viva) se resuelve solo.
async function revisarSesionGoogle() {
  if (!sb) return;
  try {
    const { data } = await sb.auth.getSession();
    const ses = data && data.session;
    if (!ses) return;
    state.googleEmail = (ses.user && ses.user.email) || '';
    LS.set('googleEmail', state.googleEmail);
    if (state.googleListo) { if (!tieneCredencial()) render(); return; }
    const r = await fetch(API + '/auth/estado', { headers: { 'Authorization': 'Bearer ' + ses.access_token } });
    if (!r.ok) return;
    const d = await r.json();
    if (d.aprobado) {
      state.googleListo = true; LS.set('googleListo', true);
      state.operario = d.nombre || state.googleEmail; LS.set('operario', state.operario);
      go('galpones'); cargarEstado(); drenarCola(true);
    } else {
      state.view = 'activarGoogle'; render();
    }
  } catch { /* sin señal: se reintenta al recargar */ }
}

async function login() {
  const codigo = $('#loginCodigo').value.trim();
  const nombre = $('#loginNombre').value.trim();
  if (!codigo) return toast('Ingresa el código');
  state.codigo = codigo;
  try {
    await api('/login', { hola: true });

    state.operario = nombre || 'operario';
    LS.set('operario', state.operario);

/* ---------- Dashboard ---------- */
function ultimaSesion(gid) { return state.sesiones.find(s => s.galpon_id === gid && s.estado === 'cerrada'); }

/* ---------- Salud del galpón ("de un vistazo") ----------
   Reglas simples y explicables, con los datos que ya registramos:
   · Conteo: desviación del último conteo cerrado (±2% ✓ · ±5% ⚠ · más ✕).
   · Mortalidad: esta semana vs. la anterior, y % sobre el teórico.
     Umbral por defecto: >1% semanal o el doble de la semana anterior
     (con mínimo de aves para no alarmar por 2 ó 3). Ajustable a criterio.
   · Frecuencia: el protocolo es contar cada semana; >7 días ⚠, >14 ✕. */
function saludGalpon(g) {
  const ahora = Date.now();
  const s = ultimaSesion(g.id);
  const d = s ? desv(s.inventario_estimado, s.inventario_teorico_snapshot ?? g.inventario_teorico) : null;

  let mort7 = 0, mortPrev = 0;
  for (const m of (state.mortalidad14 || [])) {
    if (m.galpon_id !== g.id) continue;
    const dias = (ahora - new Date(m.registrado_at).getTime()) / 86400000;
    if (dias < 0) continue;
    if (dias <= 7) mort7 += m.cantidad || 0;
    else if (dias <= 14) mortPrev += m.cantidad || 0;
  }
  const pctMort = g.inventario_teorico ? mort7 / g.inventario_teorico * 100 : null;

  const problemas = [];   // [nivel, texto] — nivel 2 = crítico, 1 = revisar
  if (d != null && Math.abs(d) > 2) {
    problemas.push([Math.abs(d) > 5 ? 2 : 1, `Conteo ${d > 0 ? '+' : ''}${d.toFixed(1)}% vs teórico`]);
  }
  if ((pctMort != null && pctMort > 1 && mort7 >= 10) || (mort7 >= 10 && mort7 >= 2 * Math.max(mortPrev, 1))) {
    problemas.push([2, `Mortalidad alta: ${fmt(mort7)} en 7 días${pctMort != null ? ` (${pctMort.toFixed(2)}%)` : ''} vs ${fmt(mortPrev)} la semana anterior`]);
  } else if (mort7 >= 5 && mort7 > mortPrev) {
    problemas.push([1, `Mortalidad subió: ${fmt(mort7)} esta semana vs ${fmt(mortPrev)} la anterior`]);
  }
  let diasSin = null;
  if (s && s.cerrada_at) {
    diasSin = Math.floor((ahora - new Date(s.cerrada_at).getTime()) / 86400000);
    if (diasSin > 7) problemas.push([diasSin > 14 ? 2 : 1, `${diasSin} días sin conteo (protocolo: semanal)`]);
  }

  let nivel, razon = null;
  if (!s && !mort7 && !mortPrev) {
    nivel = 'pendiente';
  } else {
    if (!s) problemas.push([1, 'Sin conteos aún']);
    problemas.sort((a, b) => b[0] - a[0]);
    nivel = problemas.length ? (problemas[0][0] === 2 ? 'crit' : 'warn') : 'ok';
    razon = problemas.length ? problemas[0][1] : null;
  }
  return { nivel, razon, mort7, mortPrev, pctMort, diasSin, d, s };
}

function chipSalud(nivel) {
  if (nivel === 'ok') return '<span class="status ok">✓ Sano</span>';
  if (nivel === 'warn') return '<span class="status warn">⚠ Revisar</span>';
  if (nivel === 'crit') return '<span class="status crit">✕ Atención</span>';
  return '<span class="status pending">Sin datos</span>';
}

function viewGalpones() {
  if (state.cargando && !state.galpones.length) {
    $('#main').innerHTML = `<div class="card" style="text-align:center;padding:30px"><div class="spin"></div><div class="mut" style="margin-top:10px">Cargando…</div></div>`;
    return;
  }
  const activos = state.galpones.filter(g => g.activo);
  const totalTeo = activos.reduce((a, g) => a + (g.inventario_teorico || 0), 0);
  const totalEst = activos.reduce((a, g) => a + (ultimaSesion(g.id)?.inventario_estimado ?? 0), 0);
  const saluds = Object.fromEntries(activos.map(g => [g.id, saludGalpon(g)]));
  const conAlerta = activos.filter(g => saluds[g.id].nivel === 'warn' || saluds[g.id].nivel === 'crit');
  const mortTotal7 = activos.reduce((a, g) => a + saluds[g.id].mort7, 0);
  $('#main').innerHTML = `
    <div class="tiles">
      <div class="tile"><div class="l">Inventario teórico</div><div class="v">${fmt(totalTeo || null)}</div><div class="mut">${activos.length} galpones activos</div></div>
      <div class="tile"><div class="l">Estimado por conteos</div><div class="v">${fmt(totalEst || null)}</div><div class="mut">Última sesión por galpón</div></div>
    </div>
    ${activos.length ? (conAlerta.length
      ? `<div class="hint" style="background:color-mix(in srgb, var(--warning) 14%, transparent)">⚠ <b>${conAlerta.length} ${conAlerta.length > 1 ? 'galpones' : 'galpón'} para revisar</b> — ${conAlerta.map(g => esc(g.nombre)).join(', ')}. Mortalidad total 7 días: ${fmt(mortTotal7)}.</div>`
      : `<div class="hint" style="background:color-mix(in srgb, var(--good) 10%, transparent)">✓ <b>Todo en orden</b> — sin alertas de conteo ni mortalidad. Mortalidad total 7 días: ${fmt(mortTotal7)}.</div>`) : ''}
    ${activos.length ? `<button class="back" onclick="go('guia')" style="margin-bottom:12px">📖 Guía de terreno: qué mirar y reportar ›</button>` : ''}
    <h2 class="sec">Desviación por galpón</h2>
    <div class="card">
      ${activos.map(g => {
        const s = ultimaSesion(g.id);
        const d = s ? desv(s.inventario_estimado, s.inventario_teorico_snapshot ?? g.inventario_teorico) : null;
        const w = d == null ? 0 : Math.min(Math.abs(d) / 8 * 50, 50);
        const col = d == null ? 'var(--grid)' : Math.abs(d) <= 2 ? 'var(--good)' : Math.abs(d) <= 5 ? 'var(--warning)' : 'var(--critical)';
        return `<div class="bar-row">
          <span class="bar-lbl">${esc(g.nombre)}</span>
          <div class="bar-track"><span class="zero"></span>
            ${d != null ? `<span class="bar" style="background:${col};width:${w}%;${d < 0 ? 'right:50%;border-radius:4px 0 0 4px;' : 'left:50%;'}"></span>` : ''}
          </div>
          <span class="bar-val">${d != null ? (d > 0 ? '+' : '') + d.toFixed(1) + '%' : '—'}</span>
        </div>`;
      }).join('') || '<div class="mut">Agrega galpones en Ajustes.</div>'}
      <div class="mut" style="margin-top:10px">Último conteo vs. teórico. Alerta: ±2% ✓ · ±5% ⚠ · &gt;5% ✕</div>
    </div>
    <h2 class="sec">Galpones</h2>
    ${activos.map(g => {
      const h = saluds[g.id];
      return `<div class="card">
        <div class="row">
          <h3>${esc(g.nombre)}</h3>
          ${chipSalud(h.nivel)}
        </div>
        <div class="sub">Teórico ${fmt(g.inventario_teorico)} · Estimado ${h.s ? fmt(h.s.inventario_estimado) : '—'}${h.d != null ? ` (${h.d > 0 ? '+' : ''}${h.d.toFixed(1)}%)` : ''}</div>
        <div class="mut">${h.s ? 'Último conteo: ' + fecha(h.s.cerrada_at) : 'Sin conteos aún'} · Mortalidad 7 días: ${fmt(h.mort7)}${h.pctMort != null ? ` (${h.pctMort.toFixed(2)}%)` : ''}</div>
        ${h.razon ? `<div class="mut" style="margin-top:4px;color:${h.nivel === 'crit' ? 'var(--critical)' : 'var(--ink-2)'}">${h.nivel === 'crit' ? '✕' : '⚠'} ${h.razon}</div>` : ''}
      </div>`;
    }).join('')}
    <button class="btn" onclick="go('conteo')" style="margin-top:6px">Iniciar conteo</button>
  `;
}

    d: 'Enferma aves Y personas: por el huevo llega a la cocina. Por eso existen programas oficiales enteros dedicados solo a ella.',
    h: 'Muestras al laboratorio; higiene estricta de nidos y huevos; control de roedores.' },
  { c: 'dig', n: 'Colibacilosis', a: 'El termómetro de la higiene',
    v: 'Diarrea, ombligos inflamados en pollitos, alguna cojera, decaimiento general del lote.',
    d: 'La E. coli mide tu manejo: agua sucia, cama vieja y huevos de piso la disparan. Lote con colibacilosis = revisar rutinas.',
    h: 'Clorar el agua, renovar cama, recoger huevos de piso temprano.' },
  { c: 'dig', n: 'Enteritis ulcerativa', a: 'La silenciosa (enfermedad de la codorniz)',
    v: 'Muertes sin drama: aves de aspecto casi normal que aparecen muertas; diarrea acuosa en algunas.',
    d: 'La bacteria vive en el suelo y se acumula cuando la misma cama se usa una y otra vez.',
    h: 'Veterinario; evaluar renovación completa de cama.' },
  { c: 'dig', n: 'Parásitos internos', a: 'Los okupas (ascaridiosis, heterakidosis, raillietinosis)',
    v: 'Lote desparejo y flaco que come bien sin engordar; a veces gusanos visibles en las heces.',
    d: 'Los huevos del parásito aguantan MESES en la tierra del piso. Crianza al piso sin calendario de desparasitación = okupas asegurados.',
    h: 'Desparasitar según calendario con el asesor; no improvisar dosis.' },
  { c: 'dig', n: 'Histomoniasis (histomonosis)', a: 'La cabeza negra',
    v: 'Heces color amarillo azufre, aves decaídas, cabeza oscurecida en algunas.',
    d: 'Viaja de polizón DENTRO del huevo de otro parásito (el heterakis). Desparasitando matas dos pájaros de un tiro.',
    h: 'Veterinario; y nunca criar pavos junto a gallinas: para el pavo es fulminante.' },
  { c: 'dig', n: 'Candidiasis', a: 'El buche agrio',
    v: 'Buche inflado y blando como globo de agua, aliento agrio, ave desganada.',
    d: 'Es una levadura, parienta de la del pan. Aparece tras antibióticos largos o con agua sucia: se aprovecha del desorden.',
    h: 'Higiene de bebederos a fondo; veterinario si hay varias.' },
  { c: 'dig', n: 'Micotoxinas (aflatoxicosis)', a: 'El veneno del grano guardado',
    v: 'Lote entero apagado sin enfermedad clara: comen menos, ponen menos, se enferman de todo.',
    d: 'El hongo crece en granos mal guardados y deja su veneno impregnado. Aunque el hongo muera, el veneno queda: no se arregla ni cocinando.',
    h: 'Revisar el alimento almacenado (olor, grumos, color), rotar stock, comprar grano seco.' },
  { c: 'dig', n: 'Impactación de buche', a: 'El buche de piedra',
    v: 'Bulto firme al palpar el buche; el ave traga y la comida no baja.',
    d: 'Se tapona por comer cama, fibra larga o pasto duro. Si el tapón se pudre, daña la pared del buche y la piel de alrededor.',
    h: 'Revisar la cama y el acceso al alimento; casos avanzados, veterinario.' },

  // 🧠 Nervioso
  { c: 'nerv', n: 'Marek', a: 'La parálisis del espagat',
    v: 'Ave joven con una pata estirada adelante y la otra atrás (como haciendo espagat), alas caídas, a veces pupilas grises deformes.',
    d: 'El virus vive MESES en el polvillo de las plumas que flota en el galpón. Por eso la vacuna se pone el primer día de vida: después ya es tarde.',
    h: 'No tiene tratamiento. Confirmar con el veterinario y revisar que los reemplazos vengan vacunados.' },
  { c: 'nerv', n: 'Encefalomielitis aviar', a: 'El temblor de pollito',
    v: 'Pollitos de 1 a 3 semanas con temblor fino de cabeza y cuello, sentados sobre los garrones.',
    d: 'Viene de la madre a través del huevo. Se corta vacunando a las reproductoras, no al pollito.',
    h: 'Veterinario; los afectados no se recuperan. Revisar origen de los pollitos.' },
  { c: 'nerv', n: 'Falta de vitamina B1 o vitamina E', a: 'El astrónomo (deficiencias)',
    v: 'Cuello doblado hacia atrás "mirando las estrellas" (B1), o pollitos con la cabeza loca y equilibrio perdido (E).',
    d: 'Casi nunca es infección: es alimento viejo o mal formulado. Las vitaminas se degradan solas con el tiempo y el calor de la bodega.',
    h: 'Revisar fecha y almacenamiento del alimento; corregir la fórmula con el asesor.' },

  // 🥚 Postura y huevos
  { c: 'post', n: 'Síndrome de caída de la postura (EDS-76)', a: 'El ladrón de cáscaras',
    v: 'La postura se derrumba sin aves enfermas a la vista; huevos pálidos, de cáscara fina o blanda, o sin cáscara. Ojo: la clara y la yema se ven normales, y el huevo rugoso como lija NO es de esta: ese es firma de bronquitis.',
    d: 'Este virus entró al mundo por una vacuna contaminada hace décadas... y hoy se previene precisamente vacunando. Ironías de la avicultura.',
    h: 'Antes de pensar en virus: revisar agua, horas de luz y calcio. Luego veterinario.' },
  { c: 'post', n: 'Fatiga de la ponedora en jaula', a: 'Los huesos de vidrio',
    v: 'Ponedoras que no logran pararse, huesos que se quiebran al manipularlas.',
    d: 'Cada cáscara lleva unos 2 gramos de calcio: una gran ponedora que no lo repone en la dieta se lo saca de su propio esqueleto hasta quedar de vidrio.',
    h: 'Revisar calcio, fósforo y vitamina D con el asesor; conchuela gruesa por la tarde ayuda.' },
  { c: 'post', n: 'Prolapso y picaje de cloaca', a: 'El efecto dominó', urg: 1,
    v: 'Cloaca salida después de poner, o picoteada y sangrando por las compañeras.',
    d: 'La gallina picotea lo rojo por puro instinto: UNA cloaca sangrando puede desatar canibalismo en cadena. Retirarla a tiempo salva al lote entero.',
    h: 'Separar YA a la afectada, bajar intensidad de luz, revisar tamaño de huevo (huevo gigante = más prolapsos).' },
  { c: 'post', n: 'Gota', a: 'La escarcha en las vísceras',
    v: 'Aves decaídas que mueren; por dentro, los órganos aparecen como espolvoreados con tiza blanca.',
    d: 'Es el riñón que falló: el ácido úrico cristalizó donde no debía. Culpables típicos: exceso de calcio en pollitas jóvenes o aves que pasaron sed.',
    h: 'Calcio según la edad (la pollita NO come dieta de ponedora) y agua disponible SIEMPRE.' },

  // 🦵 Patas y cojeras
  { c: 'patas', n: 'Raquitismo', a: 'Los huesos de goma',
    v: 'Aves jóvenes con patas torcidas y blandas, picos que se doblan, crecimiento frenado.',
    d: 'Falta calcio, fósforo o vitamina D. El esqueleto joven es plastilina: con la dieta corregida a tiempo, se endereza.',
    h: 'Corregir el alimento con el asesor cuanto antes.' },
  { c: 'patas', n: 'Perosis', a: 'El tendón zafado',
    v: 'Garrón hinchado; el tendón se sale de su riel y la pata queda doblada hacia afuera.',
    d: 'Clásico de dietas caseras sin minerales (manganeso). Con alimento comercial completo casi no existe.',
    h: 'Corregir la dieta; el tendón que ya se zafó no vuelve a su lugar.' },
  { c: 'patas', n: 'Pododermatitis', a: 'El callo de cama mojada',
    v: 'Plantas de las patas con costras negras y heridas; aves que caminan lo mínimo.',
    d: 'Es el medidor de humedad más honesto del galpón: patas sanas = cama seca. Patas quemadas = amoníaco y agua de más.',
    h: 'Mejorar la cama HOY: más viruta, arreglar bebederos, ventilar.' },
  { c: 'patas', n: 'Necrosis de la cabeza femoral', a: 'La cadera traicionada',
    v: 'Broilers grandes que amanecen cojeando sin golpe visible; la cojera avanza rápido.',
    d: 'Bacterias que viajaron por la sangre desde un intestino dañado se instalan en la cadera y matan el hueso por dentro. La cojera es el final de la película.',
    h: 'Veterinario; y mirar la salud intestinal del lote, que es donde empezó todo.' },

  // 🪶 Piel y plumas
  { c: 'piel', n: 'Viruela aviar', a: 'Las verrugas del zancudo',
    v: 'Costras y verrugas en cresta, barbillas y párpados. La forma interna pone placas amarillas en la boca que pueden ahogar.',
    d: 'La transmiten los ZANCUDOS: los brotes llegan después de veranos con mosquitera. Donde hay agua estancada, hay viruela esperando.',
    h: 'Vacunar (punción en el ala), aislar afectadas, eliminar aguas estancadas.' },
  { c: 'piel', n: 'Ácaro rojo y piojos', a: 'Los vampiros nocturnos',
    v: 'Aves inquietas de noche, pálidas, con postura baja; picoteo constante de plumas.',
    d: 'El ácaro rojo NO vive en el ave: de día se esconde en grietas de perchas y nidos, y de noche sale a chupar sangre. Pásale un papel blanco a las ranuras de noche: si sale rayado rojo, ahí están.',
    h: 'Tratar el GALPÓN (grietas, perchas, nidos), no solo las aves. Repetir a la semana.' },
  { c: 'piel', n: 'Patas escamosas (knemidokoptosis)', a: 'El ácaro albañil',
    v: 'Patas con escamas levantadas y costras grises como cemento mal aplicado.',
    d: 'Es un ácaro microscópico que cava túneles BAJO las escamas y vive años ahí. Viejo conocido de las aves de traspatio.',
    h: 'Aceitar o tratar las patas (asfixia al ácaro), limpiar perchas.' },
  { c: 'piel', n: 'Canibalismo', a: 'La chispa que incendia',
    v: 'Picoteo de plumas, dedos o cloacas. Empiezan dos o tres y se contagia como moda.',
    d: 'Exceso de luz, calor, aburrimiento y hacinamiento son los fósforos. El alimento molido (más tiempo comiendo) es un extintor barato.',
    h: 'Bajar la luz, retirar heridas YA, revisar densidad y dieta.' },
  { c: 'piel', n: 'Dermatitis gangrenosa', a: 'La piel morada', urg: 1,
    v: 'Parches de piel oscura y húmeda que se desprende, olor fuerte, muerte rápida.',
    d: 'Bacterias de la cama entran por rasguños y encuentran un ave con defensas bajas — frecuente después de un Gumboro mal controlado.',
    h: 'Veterinario ya; revisar cama y el historial de vacunas del lote.' },

  // 🐣 Pollitos
  { c: 'poll', n: 'Gumboro (enfermedad de la Bursa)', a: 'El destructor de defensas',
    v: 'Pollitos de 3 a 6 semanas decaídos, con diarrea acuosa blanquecina, picoteándose la cloaca. La mortandad hace un pico de 3-4 días y baja sola.',
    d: 'Destruye la bursa, el órgano donde el pollito fabrica sus defensas. Los sobrevivientes quedan desarmados contra TODO lo que venga después. Por eso esta vacuna es sagrada.',
    h: 'Veterinario y revisión del plan de vacunación completo.' },
  { c: 'poll', n: 'Onfalitis', a: 'El ombligo sucio',
    v: 'Pollitos de días con el ombligo inflamado, abdomen hinchado y olor desagradable; mueren la primera semana.',
    d: 'Nace en la incubación: huevos sucios de piso o nidos cochinos siembran la infección antes de que el pollito rompa el cascarón.',
    h: 'Recoger huevos de piso temprano y nunca incubarlos; higiene del nacimiento.' },
  { c: 'poll', n: 'Hipoglicemia del pollito (HSMS)', a: 'El bajón de energía',
    v: 'Pollitos de 1 a 2 semanas tambaleando, como ciegos, que mueren en horas.',
    d: 'El pollito casi no tiene reservas: si el alimento o la luz le fallan unas horas (comederos vacíos, corte de luz), el motor se apaga.',
    h: 'Alimento y luz continuos los primeros días; contar comederos por ave.' },
  { c: 'poll', n: 'Pullorosis', a: 'La diarrea blanca',
    v: 'Pollitos con pasta blanca pegada en la cloaca, amontonados y piando, mortandad temprana.',
    d: 'Es la salmonela de los pollitos, transmitida desde la madre por el huevo. Marcó la historia: fue de las primeras enfermedades con programa mundial de erradicación.',
    h: 'Laboratorio para confirmar; revisar el origen de los pollitos.' },

  { c: 'subitas', n: "Septicemia por Streptococcus", a: "La muerte con cresta morada",
    v: "Aves en buen estado que aparecen muertas con cresta y barbillas moradas; en la forma lenta, cojeras y decaimiento por infección del corazón.",
    d: "La bacteria entra por heridas o por la cama sucia y viaja en la sangre. La forma crónica se instala en las válvulas del corazón y suelta émbolos.",
    h: "Veterinario; revisar heridas, despique y estado de la cama." },
  { c: 'resp', n: "Clamidiosis", a: "La que también enferma personas", urg: 1,
    v: "Aves decaídas con ojos inflamados, descarga nasal y diarrea verdosa. Más común donde hay contacto con palomas o aves silvestres.",
    d: "Es ZOONOSIS: puede pasar a las personas por el polvillo y dar una fiebre tipo gripe (psitacosis). Ave sospechosa se maneja con mascarilla.",
    h: "Veterinario y laboratorio; protegerse al limpiar; alejar palomas." },
  { c: 'resp', n: "Asfixia por obstrucción", a: "El atoro",
    v: "Un ave sola que estira el cuello, boquea y muere: algo le tapó la tráquea (placa de viruela húmeda, laringotraqueítis o un cuerpo extraño).",
    d: "Casi nunca es \"el lote\": es UN ave tapada. Pero si se repite, hay una enfermedad de fondo poniendo placas en la garganta.",
    h: "Abrir el pico y mirar con linterna; si hay placas en varias, veterinario." },
  { c: 'resp', n: "Síndrome hipoxémico", a: "El galpón sin aire",
    v: "Crestas azuladas, aves lentas, y con las semanas más ascitis y muertes: falta oxígeno de forma crónica.",
    d: "El frío engaña: por no perder calor se cierra todo el galpón… y el aire se agota. Ventilación mínima es sagrada incluso en invierno.",
    h: "Garantizar ventilación mínima SIEMPRE; revisar estufas que consumen oxígeno." },
  { c: 'resp', n: "Falta de vitamina A", a: "Los ojos con lagañas de queso",
    v: "Ojos hinchados con material blanco tipo queso, nódulos blancos en la garganta, aves pálidas y postura en el suelo.",
    d: "La vitamina A cuida todas las \"mucosas\": sin ella, ojo y garganta fabrican costras. Alimento viejo o mal premezclado es el culpable clásico.",
    h: "Corregir el alimento con el asesor; mejora en 1-2 semanas si se pilla a tiempo." },
  { c: 'dig', n: "Tifoidea aviar", a: "La del hígado bronce",
    v: "Aves ADULTAS decaídas con cresta pálida y diarrea amarillenta; muertes que gotean día tras día. Por dentro, hígado agrandado color bronce.",
    d: "Es la hermana adulta de la pullorosis: misma familia Salmonella, pero ataca a las grandes. Se hereda por el huevo y se pasea con los ratones.",
    h: "Laboratorio para confirmar; control de roedores y revisión del origen de las aves." },
  { c: 'dig', n: "Infecciones paratíficas", a: "La salmonela viajera",
    v: "En las aves casi no se nota (algún pollito con diarrea); el problema es que contamina huevos y carne sin dar señales.",
    d: "Es la salmonela de las intoxicaciones de comida humana: el lote se ve sano y aun así puede estar repartiendo. Por eso existen los muestreos oficiales.",
    h: "Higiene de huevos y nidos, agua clorada, control de roedores y moscas." },
  { c: 'dig', n: "Gastritis necrótica", a: "El estómago quemado",
    v: "Aves que comen menos, se atrasan y mueren salpicadas; por dentro, la molleja y el estómago glandular aparecen con la pared muerta.",
    d: "Pariente de la enteritis necrótica (mismo Clostridium), pero ataca más arriba del tubo digestivo. Cama vieja y alimento alterado le abren la puerta.",
    h: "Veterinario; renovar cama y revisar el alimento almacenado." },
  { c: 'dig', n: "Colangiohepatitis", a: "El hígado amarillo del broiler",
    v: "Broilers atrasados que no rinden; en faena aparecen hígados duros, amarillos y agrandados que se decomisan.",
    d: "Bacterias del intestino suben por el conducto de la bilis y viven en el hígado. El galpón lo paga dos veces: menos peso y más decomiso.",
    h: "Revisar salud intestinal (coccidiosis, cama) con el veterinario." },
  { c: 'dig', n: "Espiroquetosis", a: "La fiebre de la garrapata",
    v: "Aves con fiebre, somnolientas, con diarrea verdosa y cresta pálida; muertes en pocos días. Aparece con calor y donde hay garrapatas blandas escondidas en el gallinero.",
    d: "La bacteria en espiral viaja dentro de la GARRAPATA del gallinero, que de día se esconde en grietas de madera y de noche pica. Sin garrapatas no hay espiroquetosis: la pelea es contra el bicho, no solo contra el microbio. Su prima intestinal, más discreta, da diarrea espumosa y roba postura en aves de piso.",
    h: "Tratar las GRIETAS del galpón contra garrapatas y llamar al veterinario para las aves." },
  { c: 'dig', n: "Tricomoniasis", a: "El queso de las palomas",
    v: "Placas amarillas tipo queso en boca y buche que huelen mal; el ave traga con dolor y enflaquece. En gallinas es rara: la traen las palomas.",
    d: "El parásito viaja en el agua que las palomas comparten con tus aves. Bebedero abierto al cielo = puerta de entrada.",
    h: "Cerrar el acceso de palomas a agua y alimento; veterinario para las afectadas." },
  { c: 'dig', n: "Hepatitis por cuerpos de inclusión", a: "El hígado pálido del pollito",
    v: "Broilers de 3 a 6 semanas que mueren de golpe durante unos días; por dentro, hígados pálidos, amarillentos y con puntitos de sangre.",
    d: "Es un adenovirus que se aprovecha de defensas bajas: casi siempre hay un Gumboro o una anemia infecciosa escondida detrás.",
    h: "Veterinario; revisar el plan de vacunación completo del lote y de las madres." },
  { c: 'dig', n: "Hepatitis y esplenomegalia (HSS)", a: "La de hígado y bazo grandes",
    v: "Ponedoras con muertes salpicadas y postura 1-2% más baja sin causa clara; en necropsia, hígado y bazo agrandados con sangre.",
    d: "La causa un virus pariente de la hepatitis E. Va y viene en ondas suaves: es de esas que solo el registro diario de mortalidad delata.",
    h: "Laboratorio para confirmar; reforzar bioseguridad." },
  { c: 'dig', n: "Proventriculitis (TVP)", a: "El estómago globo",
    v: "Broilers desparejos que digieren mal (alimento entero en las heces); el estómago glandular se agranda tanto que en faena se rompe.",
    d: "El proventrículo inflamado es fábrica de decomisos: la canal se contamina al romperse. Se nota semanas antes en las heces con alimento sin digerir.",
    h: "Veterinario; revisar también micotoxinas del alimento, que inflaman lo mismo." },
  { c: 'dig', n: "Infecciones por adenovirus", a: "La familia oportunista",
    v: "Rara vez dan cara sola: aparecen sumadas a otra (hígados pálidos, molleja erosionada, postura baja) cuando las defensas andan bajas.",
    d: "Muchas aves los cargan dormidos toda la vida; despiertan cuando Gumboro o el estrés bajan la guardia. Son el síntoma de otro problema.",
    h: "Buscar con el veterinario la causa inmunosupresora de fondo." },
  { c: 'dig', n: "Tuberculosis aviar", a: "La flaca crónica",
    v: "Ave vieja (típico de traspatio) que enflaquece durante meses hasta quedar en el puro esternón, comiendo igual. Por dentro, nódulos duros en hígado e intestino.",
    d: "La bacteria sobrevive AÑOS en el suelo del gallinero. Un patio con historia de tuberculosis queda marcado por mucho tiempo.",
    h: "No tiene tratamiento práctico: sacrificio sanitario y no reutilizar ese suelo para aves jóvenes." },
  { c: 'post', n: "Nefritis infecciosa aviar", a: "El riñón atacado",
    v: "Lote joven que toma más agua y moja la cama, con muertes salpicadas; después pueden venir gota y cáscaras débiles.",
    d: "Hay variantes del virus de la bronquitis que en vez de ir al pulmón van al RIÑÓN. El primer aviso no es la tos: es la cama mojada.",
    h: "Veterinario; revisar qué cepa de bronquitis se está vacunando." },
  { c: 'patas', n: "Sinovitis por Mycoplasma synoviae", a: "Las articulaciones calientes",
    v: "Aves que cojean con garrones y plantas hinchadas, calientes y blandas; el lote se sienta más de lo normal.",
    d: "Primo del micoplasma respiratorio, pero fanático de las articulaciones. También viene de la madre por el huevo.",
    h: "Asesor/veterinario; comprar reemplazos certificados libres." },
  { c: 'patas', n: "Artritis por Staphylococcus", a: "La cojera de las heridas",
    v: "Cojera con articulaciones hinchadas y calientes días después de heridas, despique o vacunación con agujas sucias.",
    d: "El estafilococo vive en la piel esperando una puerta: cualquier herida es su entrada al hueso y la articulación.",
    h: "Veterinario; higiene en manejos con aguja y cama sin astillas ni alambres." },
  { c: 'patas', n: "Artritis viral (reovirus)", a: "El tendón hinchado",
    v: "Aves medianas con los tendones sobre el garrón hinchados y duros; algunas quedan cojas para siempre o se les corta el tendón.",
    d: "El virus vive en el tendón. Hoy se controla vacunando a las reproductoras para que le pasen defensas al pollito.",
    h: "Veterinario; revisar el estado vacunal del origen de los pollitos." },
  { c: 'patas', n: "Ruptura del tendón gastrocnemio", a: "El tirón traicionero",
    v: "Reproductora o ave pesada que de un salto queda coja, con la pantorrilla hinchada y de color verdoso a los días.",
    d: "El tendón truena como cuerda de guitarra: casi siempre estaba debilitado antes por reovirus o estafilococo. El moretón verde es la firma.",
    h: "No se repara en terreno: retiro de la afectada y revisar por qué el tendón estaba débil." },
  { c: 'patas', n: "Discondroplasia tibial", a: "El cartílago crudo",
    v: "Broilers con bulto duro bajo la rodilla y patas que se arquean; caminan poco y se atrasan.",
    d: "El hueso creció tan rápido que el cartílago quedó \"crudo\", sin transformarse en hueso. Es el precio del crecimiento acelerado.",
    h: "Revisar con el asesor genética, minerales y ritmo de engorde." },
  { c: 'patas', n: "Falta de vitamina B2", a: "Los dedos enrollados",
    v: "Pollitos que caminan sobre los garrones con los dedos doblados hacia adentro, como puños cerrados.",
    d: "La riboflavina cuida los nervios de las patas: sin ella, los dedos se enrollan. Es de manual en dietas caseras sin premezcla.",
    h: "Corregir el alimento ya: si se pilla temprano, muchos se recuperan." },

function guiaEstado() {
  if (!state.guia) state.guia = { cat: '', busca: '', quiz: null };
  return state.guia;
}

function guiaBuscar(v) { guiaEstado().busca = v; pintarGuiaLista(); }
function guiaCat(id) { const g = guiaEstado(); g.cat = g.cat === id ? '' : id; pintarGuiaLista(); }

function sinTildes(s) { return s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); }

function pintarGuiaLista() {
  const g = guiaEstado();
  const cont = document.getElementById('guiaLista');
  const chips = document.getElementById('guiaChips');
  if (!cont) return;
  if (chips) chips.querySelectorAll('button').forEach(b => {
    b.style.background = b.dataset.cat === g.cat ? 'var(--accent)' : 'var(--surface-1)';
    b.style.color = b.dataset.cat === g.cat ? 'var(--accent-ink)' : 'var(--ink-1)';
  });
  const filtro = sinTildes(g.busca.trim());
  const lista = GUIA.filter(e =>
    (!g.cat || e.c === g.cat) &&
    (!filtro || sinTildes(e.n + ' ' + e.a + ' ' + e.v + ' ' + e.d + ' ' + e.h).includes(filtro)));
  const porCat = {};
  for (const e of lista) (porCat[e.c] = porCat[e.c] || []).push(e);
  cont.innerHTML = GUIA_CATS.filter(c => porCat[c.id]).map(c => `
    <h2 class="sec">${c.ic} ${c.t}</h2>
    ${porCat[c.id].map(e => `
      <div class="card" data-guia>
        <div class="row" style="align-items:flex-start">
          <div><h3>${e.n}</h3><div class="mut">"${e.a}"</div></div>
          <div style="text-align:right;flex-shrink:0">
            ${e.urg ? '<span class="status crit">Vet YA</span>' : ''}
            ${e.dob ? '<div class="mut" style="font-size:10.5px;margin-top:3px">DECLARACIÓN<br>OBLIGATORIA</div>' : ''}
          </div>
        </div>
        <div class="sub" style="margin-top:6px"><b>Lo que ves:</b> ${e.v}</div>
        <div class="sub" style="margin-top:6px;background:color-mix(in srgb, var(--accent) 7%, transparent);border-radius:8px;padding:7px 9px">💡 <b>El dato:</b> ${e.d}</div>
        <div class="sub" style="margin-top:6px"><b>Qué hacer:</b> ${e.h}</div>
      </div>`).join('')}
  `).join('') || '<div class="mut" style="padding:14px 2px">Nada con ese nombre. Prueba con otra palabra (ej: "sangre", "cojera", "huevo").</div>';
}

function guiaQuiz(resp) {
  const g = guiaEstado();
  if (!g.quiz) g.quiz = { i: 0, pts: 0, resp: null };
  const q = g.quiz;
  if (resp != null && q.resp == null) {
    q.resp = resp;
    if (resp === GUIA_QUIZ[q.i].r) q.pts++;
  } else if (resp == null && q.resp != null) {
    q.i++; q.resp = null;
    if (q.i >= GUIA_QUIZ.length) {
      const mejor = LS.get('quizMejor', 0);
      if (q.pts > mejor) LS.set('quizMejor', q.pts);
    }
  }
  pintarQuiz();
}

function guiaQuizReset() { guiaEstado().quiz = null; pintarQuiz(); }

function pintarQuiz() {
  const el = document.getElementById('guiaQuiz');
  if (!el) return;
  const q = guiaEstado().quiz;
  const mejor = LS.get('quizMejor', 0);
  if (!q) {
    el.innerHTML = `
      <h3>🎯 Ponte a prueba</h3>
      <div class="sub" style="margin:4px 0 10px">${GUIA_QUIZ.length} preguntas de galpón real. ${mejor ? `Tu mejor marca: <b>${mejor}/${GUIA_QUIZ.length}</b>.` : 'Sin miedo: nadie mira.'}</div>
      <button class="btn small" onclick="guiaQuiz()">Empezar el desafío</button>`;
    return;
  }
  if (q.i >= GUIA_QUIZ.length) {
    const tot = GUIA_QUIZ.length;
    const msj = q.pts >= tot - 1 ? '🏆 Nivel veterinario de campo. El galpón está en buenas manos.'

      : '🐣 Todos empezamos así: date una vuelta por la guía y reintenta.';
    el.innerHTML = `

    return;
  }

  el.innerHTML = `
    <div class="row"><h3>🎯 Pregunta ${q.i + 1} de ${GUIA_QUIZ.length}</h3><span class="mut">${q.pts} pts</span></div>
    <div class="sub" style="margin:8px 0 10px;font-size:14px">${p.q}</div>
    ${p.o.map((o, i) => {
      let estilo = '';
      if (q.resp != null) {
        if (i === p.r) estilo = 'background:color-mix(in srgb, var(--good) 18%, transparent);border-color:var(--good)';
        else if (i === q.resp) estilo = 'background:color-mix(in srgb, var(--critical) 14%, transparent);border-color:var(--critical)';

      return `<button class="btn small secondary" style="margin-bottom:8px;text-align:left;${estilo}" ${q.resp == null ? `onclick="guiaQuiz(${i})"` : 'disabled'}>${q.resp != null && i === p.r ? '✓ ' : ''}${o}</button>`;
    }).join('')}
    ${q.resp != null ? `
      <div class="sub" style="margin:4px 0 10px">${q.resp === p.r ? '¡Correcto!' : 'Casi.'} ${p.e}</div>
      <button class="btn small" onclick="guiaQuiz()">${q.i + 1 >= GUIA_QUIZ.length ? 'Ver resultado' : 'Siguiente ›'}</button>` : ''}
  `;
}

function abrirCamara() { $('#camInput').click(); }

$('#camInput').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file || !state.conteo) return;
  const c = state.conteo;
  c.procesando = true; render();
  try {
    const { img, b64 } = await comprimirImagen(file);
    let det = { detectado: null, confianza: null, boxes: [], detecciones: null };
    if (state.modeloUrl) {
      try { det = await inferir(b64, img); }
      catch (err) { toast('Modelo no disponible: ingresa el conteo a mano'); }
    }
    c.capturas[c.zonaActual] = { img, b64, ...det, manual: null, cliente_id: idUnico() };
  } catch (err) {
    // Foto ilegible (formato raro, archivo cortado): avisar y dejar reintentar,
    // nunca quedarse con el spinner girando para siempre.
    toast('No se pudo leer la foto, tómala de nuevo', 3500);
  } finally {
    c.procesando = false; render();
  }
});

function comprimirImagen(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      try {
        const maxW = 1280, sc = Math.min(1, maxW / img.naturalWidth);
        const cv = document.createElement('canvas');
        cv.width = Math.round(img.naturalWidth * sc); cv.height = Math.round(img.naturalHeight * sc);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        // Se devuelve el lienzo reducido, no la foto original: una foto de
        // celular ocupa ~48 MB en memoria y se guardan todas las zonas.
        res({ img: cv, b64: cv.toDataURL('image/jpeg', 0.8).split(',')[1] });
      } catch (e) { rej(e); }
      finally { URL.revokeObjectURL(url); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('imagen ilegible')); };
    img.src = url;
  });
}

async function inferir(b64, img) {
  const headers = { 'Content-Type': 'application/json' };
  if (state.modeloToken) headers['Authorization'] = 'Bearer ' + state.modeloToken;
  const r = await fetch(state.modeloUrl, { method: 'POST', headers, body: JSON.stringify({ image_b64: b64 }) });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const d = await r.json();
  const preds = d.predictions || [];
  const W = d.image?.width || img.width, H = d.image?.height || img.height;
  return {
    detectado: preds.length,
    confianza: preds.length ? preds.reduce((a, p) => a + p.confidence, 0) / preds.length : 0,
    boxes: preds.map(p => ({ x: (p.x - p.width / 2) / W, y: (p.y - p.height / 2) / H, w: p.width / W, h: p.height / H })),
    detecciones: preds,
    modelo_version: d.model_version,
  };
}

function dibujarCaptura(cap) {
  const cv = document.getElementById('capCanvas'); if (!cv) return;
  cv.width = cap.img.width; cv.height = cap.img.height;
  const ctx = cv.getContext('2d');
  ctx.drawImage(cap.img, 0, 0);
  ctx.lineWidth = Math.max(2, cv.width / 400); ctx.strokeStyle = '#2a78d6';
  (cap.boxes || []).forEach(b => ctx.strokeRect(b.x * cv.width, b.y * cv.height, b.w * cv.width, b.h * cv.height));
}

function setManual(v) { const cap = state.conteo.capturas[state.conteo.zonaActual]; cap.manual = Math.max(0, parseInt(v) || 0); render(); }
function ajustar(d) { const cap = state.conteo.capturas[state.conteo.zonaActual]; cap.manual = Math.max(0, (cap.manual ?? cap.detectado ?? 0) + d); render(); }
function repetirFoto() {
  const c = state.conteo, cap = c.capturas[c.zonaActual];
  c.reemplaza = c.reemplaza || {};
  if (cap && cap.subida) {
    // Ya está en el servidor: la foto nueva la reemplaza allá.
    c.reemplaza[c.zonaActual] = cap.cliente_id;
  } else if (cap && cap.encolada) {
    // Todavía no llegó al servidor: se saca de la cola. Si no, la vieja
    // subiría después y la zona quedaría contada dos veces.
    const q = LS.get('cola', []).filter(i =>
      !(i.ruta === '/capturas' && i.body && i.body.cliente_id === cap.cliente_id));
    LS.set('cola', q);
    if (cap.reemplazaba) c.reemplaza[c.zonaActual] = cap.reemplazaba;
    else delete c.reemplaza[c.zonaActual];
  }
  c.capturas[c.zonaActual] = null; render();
}

async function guardarZona() {
  const c = state.conteo, cap = c.capturas[c.zonaActual];
  if (!cap || c.guardando) return;
  c.guardando = true; render();
  const body = {
    cliente_id: cap.cliente_id,   // el servidor descarta repetidos
    reemplaza_cliente_id: (c.reemplaza && c.reemplaza[c.zonaActual]) || null,
    // Guardar con un conteo del modelo en pantalla ES una revisión, aunque
    // el operario no cambie el número: esas fotos son las que permiten
    // medir cuánto se equivoca cada versión del modelo.
    revisada: cap.detectado != null || cap.manual != null,
    sesion_id: c.sesionId, galpon_id: c.galpon.id, zona: c.zonaActual + 1,
    conteo_detectado: cap.detectado, confianza_media: cap.confianza,
    conteo_manual: cap.manual,
    detecciones: cap.detecciones, modelo_version: cap.modelo_version || null,
    foto_b64: cap.b64,
  };
  try {
    // Se intenta siempre: el servidor sabe resolver la sesión si falta.
    const r = await api('/capturas', body);
    cap.subida = true;
    if (!c.sesionId && r && r.sesion_id) c.sesionId = r.sesion_id;
  } catch (e) {
    // Si el servidor respondió rechazando, encolar sería mentirle al
    // operario: la cola lo descartaría después sin que nadie se entere.
    if (typeof e.status === 'number' && e.status >= 400 && e.status < 500 && e.status !== 401 && e.status !== 429) {
      c.guardando = false; render();
      return toast('El servidor rechazó esta zona y NO quedó guardada. Avisa al supervisor.', 6000);
    }
    if (!encolar('/capturas', body)) {
      // No avanzamos: sería decirle al operario que se guardó cuando no.
      c.guardando = false; render();
      return toast('NO se pudo guardar esta zona. Libera espacio o conéctate antes de seguir.', 5000);
    }
    cap.encolada = true;
    cap.reemplazaba = body.reemplaza_cliente_id || null;
    toast('Sin señal: zona en cola, se subirá sola');
  }
  c.guardando = false;
  // Si el operario abandonó este conteo mientras subíamos, no seguimos.
  if (state.conteo !== c) return;
  if (c.zonaActual + 1 < c.galpon.num_zonas) { c.zonaActual++; render(); }
  else go('conteoResumen');
}

function viewResumen() {
  const c = state.conteo; if (!c) return go('conteo');

      <div class="list-item row"><span class="sub">Suma contada</span><b>${fmt(conConteo.length ? suma : null)}</b></div>
      <div class="list-item row"><span class="sub">Factor de calibración</span><b>× ${g.factor_calibracion}</b></div>
    </div>

      <div class="tile"><div class="l">Teórico</div><div class="v">${fmt(g.inventario_teorico)}</div><div style="margin-top:4px">${statusChip(d)}</div></div>
    </div>
    ${!conConteo.length ? '<div class="hint">Sin conteos numéricos: las fotos quedan guardadas igual para entrenar el modelo.</div>' : ''}
    <button class="btn" onclick="cerrarSesion()">Cerrar conteo</button>

  `;
}

let cerrando = false;
async function cerrarSesion() {
  const c = state.conteo;
  if (!c || cerrando) return;
  cerrando = true;
  // Si la sesión nunca llegó a crearse (sin señal), mandamos el galpón:
  // el servidor cierra la sesión abierta de ese galpón.
  const cuerpo = c.sesionId ? { sesion_id: c.sesionId } : { galpon_id: c.galpon.id };
  try {
    const r = await api('/sesiones/cerrar', cuerpo);
    toast(r && r.solo_fotos ? 'Fotos guardadas (sin conteo numérico)' : 'Conteo guardado');
  } catch (e) {
    const irreparable = e.status >= 400 && e.status < 500 && e.status !== 401 && e.status !== 429;
    // Encolar un cierre rechazado sería peligroso: mañana cerraría el
    // conteo equivocado del mismo galpón.
    if (irreparable) toast('El servidor no tiene un conteo abierto que cerrar', 4500);
    else if (encolar('/sesiones/cerrar', cuerpo)) toast('Sin señal: el cierre quedó en cola');
    else toast('No se pudo cerrar el conteo. Reintenta con señal.', 4500);
  } finally { cerrando = false; }
  state.conteo = null;
  go('galpones');
  cargarEstado();
}

// Extrae cuadros del video en el propio teléfono (sin servidor): son las
// fotos que alimentan el dataset de entrenamiento.
async function extraerCuadros(file, maximo = 8) {
  const url = URL.createObjectURL(file);
  try {
    const v = document.createElement('video');
    v.preload = 'auto'; v.muted = true; v.playsInline = true; v.src = url;
    await new Promise((res, rej) => {
      v.onloadedmetadata = res; v.onerror = () => rej(new Error('video ilegible'));
      setTimeout(() => rej(new Error('video ilegible')), 15000);
    });
    const dur = v.duration && isFinite(v.duration) ? v.duration : 0;
    if (!dur || !v.videoWidth) return [];
    const cv = document.createElement('canvas');
    const esc2 = Math.min(1, 1280 / v.videoWidth);
    cv.width = Math.round(v.videoWidth * esc2); cv.height = Math.round(v.videoHeight * esc2);
    const ctx = cv.getContext('2d');
    const cuantos = Math.max(3, Math.min(maximo, Math.floor(dur / 4) || 3));
    const cuadros = [];
    for (let i = 0; i < cuantos; i++) {
      try {
        await new Promise((res, rej) => {
          v.onseeked = res; v.onerror = () => rej(new Error('seek'));
          v.currentTime = dur * (i + 0.5) / cuantos;
          setTimeout(res, 4000);   // iPhone a veces no dispara el evento
        });
        ctx.drawImage(v, 0, 0, cv.width, cv.height);
        cuadros.push(cv.toDataURL('image/jpeg', 0.8).split(',')[1]);
      } catch { /* un cuadro fallido no detiene el resto */ }
    }
    return { cuadros, dur };
  } catch { return { cuadros: [], dur: 0 }; }
  finally { URL.revokeObjectURL(url); }
}

// Sube el video DIRECTO al almacenamiento con una URL firmada del servidor.
async function subirVideo(file, galponId, alProgreso) {
  const { path, token } = await api('/videos/subir-url', { galpon_id: galponId });
  const mb = Math.max(1, Math.round(file.size / 1048576));
  alProgreso && alProgreso(`Subiendo video (${mb} MB)… 0%`);
  // XHR y no fetch: fetch no informa el progreso de SUBIDA, y con la señal
  // del campo el operario necesita ver que el video avanza.
  await new Promise((res, rej) => {
    const x = new XMLHttpRequest();
    x.open('PUT', `${SUPA_URL}/storage/v1/object/upload/sign/avicount/${path}?token=${encodeURIComponent(token)}`);
    x.setRequestHeader('Content-Type', file.type || 'video/mp4');
    x.timeout = 600000;
    x.upload.onprogress = (ev) => {
      if (ev.lengthComputable && alProgreso) {
        alProgreso(`Subiendo video (${mb} MB)… ${Math.round(ev.loaded / ev.total * 100)}%`);
      }
    };
    x.onload = () => x.status >= 200 && x.status < 300 ? res() : rej(new Error('No se pudo subir el video (' + x.status + ')'));
    x.onerror = () => rej(new Error('No se pudo subir el video (red)'));
    x.ontimeout = () => rej(new Error('No se pudo subir el video (tiempo agotado)'));
    x.send(file);
  });
  return path;
}

const manejarVideo = async e => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file || !state.puerta) return;
  const p = state.puerta;
  if (file.size > 200 * 1048576) {
    return toast('El video pesa más de 200 MB. Graba tramos más cortos (30–60 s por pasillo).', 5000);
  }
  p.procesando = true; p.progreso = 'Preparando el video…'; render();
  try {
    // 1) Cuadros para el dataset (se extraen en el teléfono, siempre)
    p.progreso = 'Extrayendo fotos del video…'; render();
    const ext = await extraerCuadros(file, 8);
    p.cuadros = ext.cuadros;
    p.videoSeg = Math.round(ext.dur || 0);
    p.videoMB = Math.max(1, Math.round(file.size / 1048576));

    // 2) Con modelo: el servidor de la granja cuenta el recorrido
    if (state.modeloUrl && p.modo === 'recorrido') {
      p.progreso = 'Contando aves (modelo)…'; render();
      const url = state.modeloUrl.replace(/\/contar\/?$/, '') + '/contar_video?stride=2&modo=' + p.modo;
      const fd = new FormData(); fd.append('video', file);
      const headers = {};
      if (state.modeloToken) headers['Authorization'] = 'Bearer ' + state.modeloToken;
      const r = await fetch(url, { method: 'POST', body: fd, headers });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      p.resultado = await r.json();
    } else if (state.modeloUrl && p.modo === 'puerta') {
      p.progreso = 'Contando aves (modelo)…'; render();
      const url = state.modeloUrl.replace(/\/contar\/?$/, '') + '/contar_video?stride=2&modo=' + p.modo;
      const fd = new FormData(); fd.append('video', file);
      const headers = {};
      if (state.modeloToken) headers['Authorization'] = 'Bearer ' + state.modeloToken;
      const r = await fetch(url, { method: 'POST', body: fd, headers });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      p.resultado = await r.json();
    } else {
      p.resultado = null;   // sin modelo: material + conteo manual opcional
    }

    // 3) El video sube a la nube como material de entrenamiento
    try {
      p.videoPath = await subirVideo(file, p.galponId, (t) => { p.progreso = t; render(); });
    } catch (eSub) {
      p.videoPath = null;
      toast('El video no alcanzó a subir (se guardan igual las fotos extraídas)', 4500);
    }

    p.clienteId = idUnico();     // un id por resultado, no por toque
    p.procesando = false;
    go('videoResultado');
  } catch (err) {
    p.procesando = false; render();
    toast('No se pudo procesar el video: ' + (err.message || 'error'), 4000);
  }
};

function ajustarVideoManual(paso) {

  p.cantidadManual = Math.max(0, (p.cantidadManual || 0) + paso);

  if (inp) inp.value = p.cantidadManual;
  pintarEstimadoVivo();
}

// Muestra el cálculo al tiro mientras se anota el conteo (n × factor =
// estimado y su desviación): el operario ve lo que va a guardar ANTES de
// guardarlo, y pilla al vuelo un número mal tecleado.
function pintarEstimadoVivo() {
  const el = document.getElementById('estimadoVivo');
  const p = state.puerta;
  if (!el || !p) return;
  const g = state.galpones.find(x => x.id === p.galponId);
  const n = p.cantidadManual || 0;
  if (!n || !g) { el.innerHTML = ''; return; }
  const f = g.factor_video || 1;
  const est = Math.round(n * f);
  const d = desv(est, g.inventario_teorico);
  el.innerHTML = `<span class="sub"><b>${fmt(n)}</b> × ${f} = <b>${fmt(est)}</b> estimado</span> ` +
    (d != null ? statusChip(d) : '<span class="mut">(sin teórico)</span>');
}

async function guardarVideo() {
  const p = state.puerta;
  if (!p || p.enviando) return;          // evita duplicar por doble toque
  const r = p.resultado;
  const g = state.galpones.find(x => x.id === p.galponId);
  const esRecorrido = p.modo === 'recorrido';

  let envio;
  if (esRecorrido) {
    // Con conteo del modelo, con conteo manual, o solo material: todo va
    // por la misma ruta, que guarda video + cuadros para entrenar.
    const cantidad = r ? Number(r.neto) : (p.cantidadManual > 0 ? p.cantidadManual : null);
    if (r && !Number.isFinite(cantidad)) return toast('El video no devolvió un conteo válido', 4000);
    envio = { ruta: '/videos/registrar', body: {
      cliente_id: p.clienteId, galpon_id: g.id, cantidad,
      factor: g.factor_video || 1, video_path: p.videoPath || null,
      frames_b64: p.cuadros || [], registrado_por: state.operario,
    } };
  } else {
    if (!Number.isFinite(Number(r?.neto))) return toast('El video no devolvió un conteo válido', 4000);
    envio = { ruta: '/movimientos', body: { cliente_id: p.clienteId, galpon_id: g.id, tipo: p.tipoMov, cantidad: r.neto, origen: 'video_linea', detalles: { in_count: r.in_count, out_count: r.out_count, neto: r.neto }, registrado_por: state.operario } };
  }

  p.enviando = true; render();
  try {
    const resp = await api(envio.ruta, envio.body);
    toast(esRecorrido && !envio.body.cantidad
      ? `Material guardado: video y ${resp.cuadros_guardados ?? 0} foto(s) para entrenar`
      : 'Guardado');
  }
  catch (e) {
    if (typeof e.status === 'number' && e.status >= 400 && e.status < 500 && e.status !== 401 && e.status !== 429) {
      p.enviando = false; render();
      return toast('El servidor rechazó el dato y NO quedó guardado.', 5000);
    }
    // Los cuadros pesan: si no caben en la cola, se conserva el conteo.
    if (esRecorrido) { envio.body.frames_b64 = []; }
    if (encolar(envio.ruta, envio.body)) toast('Sin señal: quedó en cola');
    else toast('No se pudo guardar. Reintenta con señal.', 4500);
  }
  state.puerta = null;
  go('galpones'); cargarEstado();
}

async function guardarMovimientoManual() {
  const p = state.puerta;
  if (!p || p.enviando) return;          // evita duplicar por doble toque
  if (!p.cantidadManual) return toast('Ingresa la cantidad');
  const body = { cliente_id: p.clienteId, galpon_id: p.galponId, tipo: p.tipoMov, cantidad: p.cantidadManual, origen: 'manual', registrado_por: state.operario };
  p.enviando = true; render();
  try { await api('/movimientos', body); toast('Movimiento registrado'); }
  catch (e) {
    if (typeof e.status === 'number' && e.status >= 400 && e.status < 500 && e.status !== 401 && e.status !== 429) {
      p.enviando = false; render();
      return toast('El servidor rechazó el movimiento y NO quedó guardado.', 5000);
    }
    if (encolar('/movimientos', body)) toast('Sin señal: quedó en cola');
    else toast('No se pudo guardar. Reintenta con señal.', 4500);
  }
  state.puerta = null;
  go('galpones'); cargarEstado();
}

// Anular usa doble toque (nada de diálogos que bloqueen el navegador):
// el primer toque arma el botón, el segundo dentro de 4 s confirma.
let anularArmada = null;
async function anularConteo(id) {
  if (anularArmada !== id) {
    anularArmada = id;
    setTimeout(() => { if (anularArmada === id) { anularArmada = null; render(); } }, 4000);
    return render();
  }
  anularArmada = null;
  try {
    await api('/sesiones/anular', { sesion_id: id });
    toast('Conteo anulado: ya no cuenta para el inventario');
  } catch (e) {
    toast('No se pudo anular: ' + (e.message || 'sin señal'), 4000);
  }
  cargarEstado();
}

    nombre: $('#gNombre').value.trim(),
    num_zonas: Math.max(1, parseInt($('#gZonas').value) || 6),
    inventario_teorico: $('#gTeorico').value === '' ? null : Math.max(0, parseInt($('#gTeorico').value) || 0),
    factor_calibracion: Math.max(1, parseFloat($('#gFactor').value) || 1),
    factor_video: Math.max(0.5, parseFloat($('#gFactorV').value) || 1),
    activo: $('#gActivo').value === 'true',
  };
  if (!body.nombre) return toast('Ponle nombre al galpón');
  try {
    await api('/galpones', body);
    toast('Galpón guardado');
    await cargarEstado();
    go('ajustes');
  } catch (e) { toast('No se pudo guardar: ' + e.message); }
}

/* ---------- Inicio ---------- */
// Teléfonos que ya tenían una URL puesta a mano antes de este cambio:
// se respeta su elección en vez de pisarla con la del servidor.
if (LS.get('modeloUrl', '') && LS.get('modeloUrlManual', null) === null) {
  LS.set('modeloUrlManual', LS.get('modeloUrl', ''));
}
render();
if (tieneCredencial()) { cargarEstado(); drenarCola(true); }
revisarSesionGoogle();
if (sb) sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_IN') revisarSesionGoogle(); });
</script>
</body>
</html>
