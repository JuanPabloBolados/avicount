name: Train aves-v1 bootstrap

on:
  push:
    branches:
      - feature/vision-supervision-v1.5
    paths:
      - '.github/workflows/train-aves-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/vision-supervision-v1.5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: vision/training/requirements.txt

      - id: install
        name: Install training dependencies
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          pip install -r vision/training/requirements.txt

      - id: download
        name: Download and verify PIO
        continue-on-error: true
        run: |
          python vision/training/download_pio.py --out data/pio

      - id: prepare
        name: Build small reproducible RF-DETR bootstrap set
        continue-on-error: true
        run: |
          python vision/training/prepare_pio_rfdetr.py data/pio/extracted \
            --out data/pio-bootstrap \
            --train-limit 64 \
            --valid-limit 16 \
            --seed 24082026
          find data/pio-bootstrap -maxdepth 3 -type f | head -40

      - id: train
        name: Train RF-DETR Nano CPU bootstrap
        continue-on-error: true
        run: |
          python vision/training/train_aves_v1.py data/pio-bootstrap \
            --model nano \
            --out runs/aves-v1-bootstrap \
            --epochs 1 \
            --batch-size 1 \
            --grad-accum 4 \
            --resolution 384 \
            --device cpu \
            --workers 2 \
            --eval-interval 1

      - name: Record provenance
        if: always()
        run: |
          mkdir -p runs/aves-v1-bootstrap
          python - <<'PY'
          import json, os, platform, subprocess, sys
          from pathlib import Path
          p = Path('runs/aves-v1-bootstrap/provenance.json')
          p.write_text(json.dumps({
              'kind': 'bootstrap-cpu',
              'production_ready': False,
              'model': 'RF-DETR Nano',
              'dataset': 'PIO subset: 64 train / 16 valid',
              'seed': 24082026,
              'epochs': 1,
              'python': sys.version,
              'platform': platform.platform(),
              'commit': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
              'run_id': os.getenv('GITHUB_RUN_ID'),
          }, indent=2), encoding='utf-8')
          PY

      - id: artifact
        name: Upload checkpoint and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aves-v1-bootstrap-${{ github.sha }}
          path: |
            runs/aves-v1-bootstrap/**
            data/pio/zenodo_manifest.json
            data/pio-bootstrap/data.yaml
          if-no-files-found: warn
          retention-days: 7

      - name: Publish machine-readable result to branch
        if: always()
        env:
          INSTALL: ${{ steps.install.outcome }}
          DOWNLOAD: ${{ steps.download.outcome }}
          PREPARE: ${{ steps.prepare.outcome }}
          TRAIN: ${{ steps.train.outcome }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          checkpoint = Path('runs/aves-v1-bootstrap/checkpoint_best_total.pth')
          result = {
              'run_id': int(os.environ['RUN_ID']),
              'run_attempt': int(os.environ['RUN_ATTEMPT']),
              'source_sha': os.environ['SOURCE_SHA'],
              'install': os.environ['INSTALL'],
              'download': os.environ['DOWNLOAD'],
              'prepare': os.environ['PREPARE'],
              'train': os.environ['TRAIN'],
              'checkpoint_created': checkpoint.exists(),
              'checkpoint_bytes': checkpoint.stat().st_size if checkpoint.exists() else 0,
              'production_ready': False,
              'note': 'CPU bootstrap only; promotion requires held-out AviCount benchmark.'
          }
          Path('vision/training/bootstrap_result.json').write_text(json.dumps(result, indent=2), encoding='utf-8')
          print(json.dumps(result, indent=2))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add vision/training/bootstrap_result.json
          git commit -m "CI: record aves-v1 bootstrap result [skip ci]" || true
          git push origin HEAD:feature/vision-supervision-v1.5
